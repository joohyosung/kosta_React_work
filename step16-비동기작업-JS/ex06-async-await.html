<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Promise then 사용하기 ( 하나, 둘, 셋 ... 동기적으로 출력)</h1>
    <script>
      console.log("start...");
      const taskA = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("하나");
          }, 2000);
        });
      };

      const taskB = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            // resolve("둘");
            reject(new Error("error 발생"));
          }, 1000);
        });
      };

      const taskC = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("셋");
          }, 1500);
        });
      };

      ////////////////////////////////////////////////
      // 호출하기
      const test = async () => {
        try {
          let resultA = await taskA();
          console.log(resultA);

          let resultB = await taskB();
          console.log(resultB);

          let resultC = await taskC();
          console.log(resultC);
        } catch (err) {
          console.log(err);
        } finally {
          console.log("무조건 실행");
        }
      };

      const re = test();
      console.log(re);

      console.log("end...");
    </script>
  </body>
</html>
